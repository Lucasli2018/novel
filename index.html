<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玉灯奇物馆 · Jade Lantern Curio</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<script src="assets/marked.min.js"></script>
<!-- 内联数据：本地 file:// 双击打开时使用；线上 http(s) 优先 fetch 实时 JSON，失败回退到此 -->
<script src="assets/data.js"></script>
<style>
:root{
  --bg:#f4ecd8;--card:#fbf6ed;--text:#5b4636;--sub:#8b7355;
  --accent:#b8975a;--accent2:#c23b22;--border:#e6dcc8;
  --shadow:0 6px 22px rgba(0,0,0,0.06);--radius-lg:24px;--radius-md:16px;--radius-pill:9999px;
  --reader-bg:#fbf6ed;--reader-text:#5b4636;--transition:0.3s ease;
}
[data-theme="light"]{--bg:#f4f6f9;--card:#ffffff;--text:#333;--sub:#666;--border:#eeeeee;--reader-bg:#fff;--reader-text:#333;}
[data-theme="dark"]{--bg:#121212;--card:#2d2d2d;--text:#e0e0e0;--sub:#aaa;--border:#444;--reader-bg:#202020;--reader-text:#e0e0e0;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;background:var(--bg);color:var(--text);padding:16px;transition:var(--transition)}
.container{max-width:1100px;margin:0 auto}
.top-nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:16px 22px;margin-bottom:22px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);border:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-brand img{width:42px;height:42px;border-radius:12px;object-fit:cover;box-shadow:var(--shadow)}
.nav-brand h1{font-size:1.35rem;color:var(--accent);font-weight:700;line-height:1.2}
.nav-brand .sub{font-size:.72rem;color:var(--sub);font-weight:400}
.nav-links{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nav-links a,.nav-links button{text-decoration:none;color:var(--sub);font-size:.85rem;padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius-pill);cursor:pointer;background:transparent;transition:var(--transition);font-family:inherit}
.nav-links a:hover,.nav-links button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.lang-btn{padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius-pill);background:transparent;color:var(--text);cursor:pointer;font-size:.85rem;transition:var(--transition);font-family:inherit}
.lang-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.theme-cycle{border:1px solid var(--border);border-radius:var(--radius-pill);background:transparent;color:var(--text);cursor:pointer;padding:8px 14px;font-size:.9rem;font-family:inherit}

.status-tip{text-align:center;color:var(--sub);padding:10px;margin-bottom:16px;font-size:.95rem}
.loader{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:30px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* bookshelf */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;margin-bottom:30px}
.book-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;cursor:pointer;transition:all .3s ease;display:flex;flex-direction:column}
.book-card:hover{transform:translateY(-6px);box-shadow:0 14px 34px rgba(0,0,0,.14);border-color:var(--accent)}
.book-cover{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:linear-gradient(135deg,#1a1a2e,#2a2418)}
.book-body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.book-title{font-size:1.2rem;font-weight:700;color:var(--text)}
.book-author{font-size:.82rem;color:var(--sub)}
.book-intro{font-size:.88rem;color:var(--sub);line-height:1.6;flex:1;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.book-meta{font-size:.8rem;color:var(--accent);margin-top:4px}

/* chapter list */
.back-btn{background:transparent;border:1px solid var(--border);color:var(--accent);padding:9px 18px;border-radius:14px;cursor:pointer;font-size:.9rem;font-family:inherit;transition:var(--transition)}
.back-btn:hover{background:var(--accent);color:#fff}
.book-head{display:flex;gap:20px;margin-bottom:24px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;box-shadow:var(--shadow)}
.book-head img{width:140px;aspect-ratio:3/4;object-fit:cover;border-radius:12px;flex-shrink:0}
.book-head .bh-info{flex:1}
.book-head h2{font-size:1.5rem;color:var(--accent);margin-bottom:4px}
.book-head .author{color:var(--sub);font-size:.85rem;margin-bottom:10px}
.book-head .intro{color:var(--sub);font-size:.92rem;line-height:1.7}
.chapter-list{display:flex;flex-direction:column;gap:10px}
.chapter-item{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:var(--transition)}
.chapter-item:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateX(4px)}
.chapter-item .ch-no{font-size:.8rem;color:var(--accent);font-weight:700;min-width:40px}
.chapter-item:hover .ch-no{color:#fff}
.chapter-item .ch-title{flex:1;font-size:1rem}

/* reader */
#reader-view{display:none;background:var(--reader-bg);padding:28px;border-radius:var(--radius-lg);box-shadow:var(--shadow);border:1px solid var(--border);margin-top:14px}
.reader-top{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.reader-top img{width:48px;height:48px;border-radius:10px;object-fit:cover}
.reader-top .rt-title{font-size:1.1rem;font-weight:700;color:var(--accent)}
.reader-top .rt-sub{font-size:.8rem;color:var(--sub)}
#reader-content{line-height:1.9;word-break:break-word;padding:6px 0;color:var(--reader-text);font-size:18px;max-width:760px;margin:0 auto}
#reader-content h1,#reader-content h2,#reader-content h3{color:var(--accent);margin:18px 0 10px}
#reader-content p{margin-bottom:14px}
#reader-content blockquote{border-left:3px solid var(--accent);padding:6px 16px;margin:14px 0;color:var(--sub);background:rgba(184,151,90,.08);border-radius:0 8px 8px 0}
#reader-content hr{border:none;border-top:1px solid var(--border);margin:20px 0}
#reader-content img{max-width:100%;border-radius:10px}
.reader-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px;background:rgba(0,0,0,.03);border-radius:14px;margin:18px auto;max-width:760px}
.reader-tools span{color:var(--sub);font-size:.85rem}
.reader-tools button{padding:7px 13px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text);cursor:pointer;font-size:.82rem;font-family:inherit;transition:var(--transition)}
.reader-tools button:hover{background:var(--accent);color:#fff}
.chap-nav{display:flex;justify-content:space-between;gap:12px;max-width:760px;margin:22px auto 0}
.chap-nav button{flex:1;padding:13px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--text);cursor:pointer;font-size:.9rem;transition:var(--transition);font-family:inherit}
.chap-nav button:hover:not(:disabled){background:var(--accent);color:#fff}
.chap-nav button:disabled{opacity:.4;cursor:not-allowed}

/* curio callout */
.curio{margin:26px auto 0;max-width:760px;background:linear-gradient(135deg,rgba(184,151,90,.12),rgba(194,59,34,.08));border:1px solid var(--accent);border-radius:16px;padding:18px 20px}
.curio h4{color:var(--accent2);font-size:.95rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.curio-list{display:flex;flex-wrap:wrap;gap:14px}
.curio-item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;width:calc(50% - 7px);text-decoration:none;color:var(--text);transition:var(--transition)}
.curio-item:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.1)}
.curio-item img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0}
.curio-item .ci-name{font-size:.9rem;font-weight:600}
.curio-item .ci-meaning{font-size:.78rem;color:var(--sub);line-height:1.4;margin-top:2px}

/* codex */
.codex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;margin-top:10px}
.codex-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;display:flex;flex-direction:column;transition:all .3s ease}
.codex-card:hover{transform:translateY(-5px);box-shadow:0 12px 30px rgba(0,0,0,.12);border-color:var(--accent)}
.codex-card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#1a1a2e}
.codex-body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.codex-body .cx-name{font-size:1rem;font-weight:700;color:var(--text)}
.codex-body .cx-el{font-size:.72rem;color:var(--accent);text-transform:capitalize}
.codex-body .cx-meaning{font-size:.84rem;color:var(--sub);line-height:1.55;flex:1}
.codex-body a{margin-top:6px;text-align:center;text-decoration:none;background:var(--accent);color:#fff;padding:9px;border-radius:10px;font-size:.82rem;transition:var(--transition)}
.codex-body a:hover{background:var(--accent2)}

.error-tip{color:#c23b22;background:rgba(194,59,34,.1);padding:16px 20px;border-radius:12px;margin:20px 0;text-align:center}
.search-bar{width:100%;margin-bottom:18px;display:flex;gap:10px}
#searchInput{flex:1;padding:11px 18px;border:1px solid var(--border);border-radius:var(--radius-pill);background:var(--card);color:var(--text);font-size:.95rem;outline:none;font-family:inherit}
#searchInput:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(184,151,90,.2)}
.shop-link{color:var(--accent2)!important;font-weight:600}
@media(max-width:640px){
  .book-head{flex-direction:column}
  .book-head img{width:120px;align-self:center}
  .curio-item{width:100%}
  #reader-content{font-size:16px}
}
</style>
</head>
<body data-theme="sepia">
<div class="container">
  <nav class="top-nav">
    <div class="nav-brand" onclick="goShelf()" style="cursor:pointer">
      <img id="brandCover" src="covers/jade-lantern.png" alt="">
      <div>
        <h1 id="siteTitle">玉灯奇物馆</h1>
        <div class="sub" id="siteSub">Jade Lantern Curio</div>
      </div>
    </div>
    <div class="nav-links">
      <a href="javascript:goShelf()" id="navShelf">书架</a>
      <a href="javascript:goCodex()" id="navCodex">奇物图鉴</a>
      <a href="javascript:void(0)" class="shop-link" id="navShop" target="_blank">店铺 ↗</a>
      <button class="lang-btn" id="langZh" onclick="setLang('zh')">中文</button>
      <button class="lang-btn" id="langEn" onclick="setLang('en')">EN</button>
      <button class="theme-cycle" id="themeBtn" onclick="cycleTheme()" title="切换主题">📖</button>
    </div>
  </nav>

  <div id="searchBar" class="search-bar" style="display:none">
    <input id="searchInput" placeholder="搜索书名 / 章节…">
  </div>

  <div id="statusTip" class="status-tip"></div>
  <div id="loader" class="loader" style="display:none"></div>
  <div id="mainView"></div>

  <div id="reader-view">
    <div class="reader-top">
      <img id="rCover" src="" alt="">
      <div>
        <div class="rt-title" id="rTitle"></div>
        <div class="rt-sub" id="rSub"></div>
      </div>
      <div style="flex:1"></div>
      <button class="back-btn" onclick="backToBook()"><i class="fa fa-arrow-left"></i> <span id="backLabel">返回</span></button>
    </div>
    <div id="reader-content"></div>
    <div class="curio" id="curioBox" style="display:none">
      <h4>🔮 <span id="curioTitle">本集奇物</span></h4>
      <div class="curio-list" id="curioList"></div>
    </div>
    <div class="reader-tools" id="readerTools">
      <span id="fontLabel">字号</span>
      <button onclick="changeFontSize(-2)">A-</button>
      <button onclick="changeFontSize(2)">A+</button>
      <span id="themeLabel" style="margin-left:10px">主题</span>
      <button onclick="cycleTheme()">📖 / ☀ / 🌙</button>
    </div>
    <div class="chap-nav">
      <button id="prevChap" onclick="navChapter(-1)">← <span id="prevLabel">上一章</span></button>
      <button id="nextChap" onclick="navChapter(1)"><span id="nextLabel">下一章</span> →</button>
    </div>
  </div>
</div>

<script>
// ============ 配置与状态 ============
const LS_LANG="jl_lang", LS_THEME="jl_theme", LS_FONT="jl_font";
let DATA=null, CODEX=null;
let lang = localStorage.getItem(LS_LANG) || "zh";
let themeIdx = 0; const THEMES=["sepia","light","dark"]; const THEME_ICON={sepia:"📖",light:"☀",dark:"🌙"};
const themeSaved = localStorage.getItem(LS_THEME);
if(themeSaved) themeIdx = THEMES.indexOf(themeSaved)>=0?THEMES.indexOf(themeSaved):0;
let fontSize = parseInt(localStorage.getItem(LS_FONT))||18;
let view="shelf", curBook=null, curChap=-1, contentCache={};

const $=id=>document.getElementById(id);
const t=z=>lang==="zh"?z.zh:z.en;
const showStatus=s=>$("statusTip").textContent=s;
const showError=s=>$("statusTip").innerHTML=`<div class="error-tip">${s}</div>`;

// ============ 数据加载（兼容 file:// 双击与 http(s) 部署） ============
const EMBED = window.__EMBED__ || null;
const IS_FILE = location.protocol === "file:";
// file:// 下 fetch 被 CORS 拦截，直接用内联数据；http(s) 优先 fetch 实时 JSON，失败回退内联
async function loadBooksData(){
  if(IS_FILE && EMBED && EMBED.books) return EMBED.books;
  try{ const r=await fetch("books.json"); if(!r.ok) throw 0; return await r.json(); }
  catch(e){ if(EMBED && EMBED.books) return EMBED.books; throw e; }
}
async function loadCodexData(){
  if(IS_FILE && EMBED && EMBED.codex) return EMBED.codex;
  try{ const r=await fetch("codex/codex.json"); if(!r.ok) throw 0; return await r.json(); }
  catch(e){ if(EMBED && EMBED.codex) return EMBED.codex; throw e; }
}
// 章节正文：file:// 直接用内联（fetch 必失败）；http(s) 优先实时 fetch，失败回退内联
async function loadChapterText(key){
  if(IS_FILE){
    if(EMBED && EMBED.chapters && EMBED.chapters[key]!=null) return EMBED.chapters[key];
    throw new Error("chapter not embedded: "+key);
  }
  if(contentCache[key]) return contentCache[key];
  try{
    const res=await fetch(encodeURI(key));
    if(!res.ok) throw new Error("HTTP "+res.status);
    const md=await res.text();
    contentCache[key]=md;
    return md;
  }catch(e){
    if(EMBED && EMBED.chapters && EMBED.chapters[key]!=null) return EMBED.chapters[key];
    throw e;
  }
}

// ============ 初始化 ============
window.onload=async()=>{
  applyTheme(); applyLangButtons();
  $("loader").style.display="block";
  showStatus(lang==="zh"?"加载中…":"Loading…");
  try{
    const [b,c]=await Promise.all([loadBooksData(), loadCodexData()]);
    DATA=b; CODEX=c;
    $("siteTitle").textContent=t({zh:DATA.siteTitle.split(" · ")[0],en:DATA.siteTitle.split(" · ")[1]||DATA.siteTitle});
    $("siteSub").textContent=t({zh:"Jade Lantern Curio",en:"玉灯奇物馆"});
    $("navShop").href=DATA.shopBase||"#";
    renderShelf();
  }catch(e){
    showError((lang==="zh"?"加载失败：":"Load failed: ")+e.message+"<br><small>"+(lang==="zh"?"请通过本地服务器（如 python -m http.server）打开，或确认 assets/data.js 已生成。":"Open via a local server (e.g. python -m http.server), or ensure assets/data.js is generated.")+"</small>");
  }finally{ $("loader").style.display="none"; }
};

// ============ 视图渲染 ============
function renderShelf(filter){
  view="shelf"; $("reader-view").style.display="none"; $("searchBar").style.display="flex";
  const q=(filter||"").toLowerCase();
  const books=DATA.books.filter(b=>{
    if(!q) return true;
    const title=b.langs[lang].title.toLowerCase();
    const intro=t(b.intro).toLowerCase();
    const ch=b.chapters.some(c=>t(c.title).toLowerCase().includes(q));
    return title.includes(q)||intro.includes(q)||ch;
  });
  let html=`<div class="book-grid">`;
  books.forEach(b=>{
    const title=b.langs[lang].title, intro=t(b.intro), author=b.author;
    html+=`<div class="book-card" onclick="openBook('${b.id}')">
      <img class="book-cover" src="${b.cover}" alt="${title}" onerror="this.style.background='linear-gradient(135deg,#1a1a2e,#2a2418)'">
      <div class="book-body">
        <div class="book-title">${title}</div>
        <div class="book-author">✍️ ${author}</div>
        <div class="book-intro">${intro}</div>
        <div class="book-meta">📚 ${b.chapters.length} ${lang==="zh"?"章":"chapters"}</div>
      </div></div>`;
  });
  html+=`</div>`;
  $("mainView").innerHTML=html;
  showStatus(books.length? (lang==="zh"?`共 ${books.length} 部作品`:`${books.length} book(s)`):(lang==="zh"?"没有匹配的作品":"No matching books"));
}

function openBook(id){
  const b=DATA.books.find(x=>x.id===id); if(!b) return;
  curBook=b; view="book"; $("reader-view").style.display="none"; $("searchBar").style.display="none";
  const title=b.langs[lang].title, intro=t(b.intro);
  let html=`<button class="back-btn" onclick="goShelf()" style="margin-bottom:16px">← ${lang==="zh"?"返回书架":"Back to shelf"}</button>
    <div class="book-head">
      <img src="${b.cover}" alt="${title}" onerror="this.style.background='linear-gradient(135deg,#1a1a2e,#2a2418)'">
      <div class="bh-info">
        <h2>${title}</h2>
        <div class="author">✍️ ${b.author}</div>
        <div class="intro">${intro}</div>
      </div>
    </div>
    <div class="chapter-list">`;
  b.chapters.forEach((c,i)=>{
    html+=`<div class="chapter-item" onclick="openReader('${b.id}',${i})">
      <div class="ch-no">${String(c.n).padStart(2,"0")}</div>
      <div class="ch-title">${t(c.title)}</div></div>`;
  });
  html+=`</div>`;
  $("mainView").innerHTML=html;
  showStatus("");
}

async function openReader(bookId,idx){
  const b=DATA.books.find(x=>x.id===bookId); if(!b) return;
  curBook=b; curChap=idx; view="reader";
  const c=b.chapters[idx];
  const bTitle=b.langs[lang].title, cTitle=t(c.title);
  $("rCover").src=b.cover;
  $("rTitle").textContent=bTitle;
  $("rSub").textContent=cTitle;
  $("backLabel").textContent=lang==="zh"?"返回书目":"Back";
  $("reader-content").innerHTML=`<div class="loader"></div>`;
  $("reader-view").style.display="block"; $("mainView").innerHTML="";
  window.scrollTo({top:0,behavior:"smooth"});
  try{
    const key=c[lang];
    const md=await loadChapterText(key);
    $("reader-content").innerHTML=marked.parse(md);
    $("reader-content").style.fontSize=fontSize+"px";
    renderCurio(c.products||[]);
    $("prevChap").disabled=idx===0; $("nextChap").disabled=idx===b.chapters.length-1;
    $("prevLabel").textContent=lang==="zh"?"上一章":"Prev"; $("nextLabel").textContent=lang==="zh"?"下一章":"Next";
    showStatus("");
  }catch(e){
    $("reader-content").innerHTML=`<div class="error-tip">${lang==="zh"?"章节加载失败：":"Chapter load failed: "}${e.message}<br><small>${lang==="zh"?"请通过本地服务器打开":"Use a local server"}</small></div>`;
  }
}

function renderCurio(ids){
  if(!ids.length||!CODEX){ $("curioBox").style.display="none"; return; }
  const items=ids.map(id=>CODEX.find(p=>p.id===id)).filter(Boolean);
  if(!items.length){ $("curioBox").style.display="none"; return; }
  let html="";
  items.forEach(p=>{
    const name=p.nameZh||p.name, meaning=p.meaningZh||p.meaning;
    const url=`${DATA.shopBase}/#/product/${p.id}`;
    html+=`<a class="curio-item" href="${url}" target="_blank" rel="noopener">
      <img src="${p.image}" alt="${name}" onerror="this.style.background='#1a1a2e'">
      <div><div class="ci-name">${name}</div><div class="ci-meaning">${meaning}</div></div></a>`;
  });
  $("curioList").innerHTML=html;
  $("curioTitle").textContent=lang==="zh"?"本集奇物 · Curio of this chapter":"Curio of this chapter";
  $("curioBox").style.display="block";
}

function navChapter(d){
  const ni=curChap+d;
  if(ni>=0 && ni<curBook.chapters.length) openReader(curBook.id,ni);
}

function backToBook(){ openBook(curBook.id); }

// ============ 奇物图鉴 ============
function goCodex(){
  view="codex"; $("reader-view").style.display="none"; $("searchBar").style.display="none";
  if(!CODEX){ $("mainView").innerHTML=`<div class="error-tip">${lang==="zh"?"图鉴未加载":"Codex not loaded"}</div>`; return; }
  let html=`<h2 style="color:var(--accent);margin:6px 0 4px">🔮 ${lang==="zh"?"奇物图鉴":"Curio Codex"}</h2>
    <p style="color:var(--sub);margin-bottom:16px;font-size:.9rem">${lang==="zh"?"小说里出现过的真实东方器物，均来自 AuraSage 东方神秘文化店铺。":"The real Eastern curios that appear in the story, all from the AuraSage shop of Eastern mysticism."}</p>
    <div class="codex-grid">`;
  CODEX.forEach(p=>{
    const name=p.nameZh||p.name, meaning=p.meaningZh||p.meaning;
    const el = lang==="zh" ? ({wood:"木",fire:"火",earth:"土",metal:"金",water:"水"}[p.element]||p.element) : p.element;
    const url=`${DATA.shopBase}/#/product/${p.id}`;
    html+=`<div class="codex-card">
      <img src="${p.image}" alt="${name}" onerror="this.style.background='#1a1a2e'">
      <div class="codex-body">
        <div class="cx-name">${name}</div>
        <div class="cx-el">${el} · ${p.type}</div>
        <div class="cx-meaning">${meaning}</div>
        <a href="${url}" target="_blank" rel="noopener">${lang==="zh"?"在店铺查看":"View in shop"} ↗</a>
      </div></div>`;
  });
  html+=`</div>`;
  $("mainView").innerHTML=html;
  showStatus("");
}

// ============ 导航/语言/主题 ============
function goShelf(){ renderShelf($("searchInput").value); }
function applyLangButtons(){
  $("langZh").classList.toggle("active",lang==="zh");
  $("langEn").classList.toggle("active",lang==="en");
}
function setLang(l){
  if(lang===l) return; lang=l; localStorage.setItem(LS_LANG,lang);
  document.documentElement.lang = l==="zh"?"zh-CN":"en";
  applyLangButtons();
  // 重渲染当前视图，保持位置
  if(view==="shelf") renderShelf($("searchInput").value);
  else if(view==="book"&&curBook) openBook(curBook.id);
  else if(view==="codex") goCodex();
  else if(view==="reader"&&curBook) openReader(curBook.id,curChap);
}
function applyTheme(){ document.body.dataset.theme=THEMES[themeIdx]; $("themeBtn").textContent=THEME_ICON[THEMES[themeIdx]]; }
function cycleTheme(){ themeIdx=(themeIdx+1)%THEMES.length; localStorage.setItem(LS_THEME,THEMES[themeIdx]); applyTheme(); }
function changeFontSize(d){ fontSize=Math.max(14,Math.min(28,fontSize+d)); localStorage.setItem(LS_FONT,fontSize); if($("reader-content")) $("reader-content").style.fontSize=fontSize+"px"; }
// 搜索（书架页实时过滤）
$("searchInput") && $("searchInput").addEventListener("input",e=>{ if(view==="shelf") renderShelf(e.target.value); });
$("searchInput") && $("searchInput").addEventListener("keydown",e=>{ if(e.key==="Enter"&&view==="shelf") renderShelf(e.target.value); });
</script>
</body>
</html>
